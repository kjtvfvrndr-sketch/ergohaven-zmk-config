CONFIG_INPUT=y

# MacOS on Apple Silicon always use 15ms, and without fixed 12 interval lose latency properties (0 vs 30 ZMK default).
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12

# Buffer increase to avoid BLE trottling on trackball data.
CONFIG_BT_BUF_ACL_TX_COUNT=10

# ── Сплит-линк, параметры ACTIVE (с ними линк создаётся) ──
CONFIG_ZMK_SPLIT_BLE_PREF_INT=10
CONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=12
CONFIG_ZMK_SPLIT_BLE_PREF_TIMEOUT=600

# ── Лестница простоя ──
CONFIG_ZMK_SPLIT_CONN_LADDER=y
CONFIG_ZMK_SPLIT_CONN_LADDER_STEPS=4
CONFIG_ZMK_USB_RESUME_RESEND=y

# Интервал экономит центральную, латентность — только периферию, и она же
# определяет время возврата. Ступени подобраны под бюджет разгона ~1.5 с.
#
# Ступень 1 — через 1 мин после IDLE. 30 мс/lat14, central 360 мкА.
CONFIG_ZMK_SPLIT_CONN_LADDER_S1_AFTER_MS=0
CONFIG_ZMK_SPLIT_CONN_LADDER_S1_INT=25
CONFIG_ZMK_SPLIT_CONN_LADDER_S1_LATENCY=14
CONFIG_ZMK_SPLIT_CONN_LADDER_S1_TIMEOUT=800
CONFIG_ZMK_SPLIT_CONN_LADDER_S1_USB_LATENCY=29

# Ступень 2 — через 2.5 мин. 60 мс/lat5, central 181 мкА.
CONFIG_ZMK_SPLIT_CONN_LADDER_S2_AFTER_MS=150000
CONFIG_ZMK_SPLIT_CONN_LADDER_S2_INT=49
CONFIG_ZMK_SPLIT_CONN_LADDER_S2_LATENCY=5
CONFIG_ZMK_SPLIT_CONN_LADDER_S2_TIMEOUT=800
CONFIG_ZMK_SPLIT_CONN_LADDER_S2_USB_LATENCY=29

# Ступень 3 — через 10 мин. 120 мс/lat1, central 92 мкА.
CONFIG_ZMK_SPLIT_CONN_LADDER_S3_AFTER_MS=570000
CONFIG_ZMK_SPLIT_CONN_LADDER_S3_INT=97
CONFIG_ZMK_SPLIT_CONN_LADDER_S3_LATENCY=1
CONFIG_ZMK_SPLIT_CONN_LADDER_S3_TIMEOUT=800
CONFIG_ZMK_SPLIT_CONN_LADDER_S3_USB_LATENCY=49

# Ступень 4 — через 20 мин. 200 мс/lat4, central ~40 мкА.
CONFIG_ZMK_SPLIT_CONN_LADDER_S4_AFTER_MS=1170000
CONFIG_ZMK_SPLIT_CONN_LADDER_S4_INT=319
CONFIG_ZMK_SPLIT_CONN_LADDER_S4_LATENCY=0
CONFIG_ZMK_SPLIT_CONN_LADDER_S4_TIMEOUT=800
CONFIG_ZMK_SPLIT_CONN_LADDER_S4_USB_LATENCY=49

# Current keyboard features upgrade need more stack size.
CONFIG_INPUT_THREAD_STACK_SIZE=1024
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3072
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=1536
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=1024

CONFIG_PMW3610_ALT=y
CONFIG_PMW3610_ALT_SMART_ALGORITHM=y
CONFIG_PMW3610_ALT_INIT_POWER_UP_EXTRA_DELAY_MS=50

# When keyboard part with trackball has power by usb - no need to go out fron RUN state.
CONFIG_PMW3610_ALT_FORCE_AWAKE_ON_USB_POWER=y

# To much trackball data leads to BLE trottling, so we need to limit report interval for BLE and use 0ms (unlimited) for USB.
CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN_USB=0
CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN_BLE=8

# Optimization for trackball settings restore feature.
CONFIG_PMW3610_ALT_UNRESOLVED_MAX=2

CONFIG_PMW3610_ALT_RUN_DOWNSHIFT_TIME_MS=128
CONFIG_PMW3610_ALT_REST1_SAMPLE_TIME_MS=40
CONFIG_PMW3610_ALT_REST1_DOWNSHIFT_TIME_MS=3200
CONFIG_PMW3610_ALT_REST2_SAMPLE_TIME_MS=200
CONFIG_PMW3610_ALT_REST2_DOWNSHIFT_TIME_MS=25600
CONFIG_PMW3610_ALT_REST3_SAMPLE_TIME_MS=300