# Применяется только к правой (central) половине — той, где стоит трекбол.
CONFIG_ZMK_POINTING=y
CONFIG_SPI=y

CONFIG_PMW3610=y
CONFIG_PMW3610_SMART_ALGORITHM=y

# Ориентация — из RMK-конфига K04. Совпадает с тем, что стоит у
# standalone-трекбола Ergohaven, и ОТЛИЧАЕТСЯ от Velvet UI
# (там INVERT_X=y/INVERT_Y=y — иначе смонтирован сенсор).
# Если курсор поедет не туда — крутить только эти три флага.
CONFIG_PMW3610_SWAP_XY=y
CONFIG_PMW3610_INVERT_X=n
CONFIG_PMW3610_INVERT_Y=n

# Частота отчётов сенсора. 12 мс (~83 Гц) — заводское значение Ergohaven.
# Под вашу задачу "снизить задержку" можно попробовать 8 (~125 Гц);
# ниже смысла мало — упрётесь в BLE-интервал соединения.
CONFIG_PMW3610_REPORT_INTERVAL_MIN=12

CONFIG_PMW3610_INIT_POWER_UP_EXTRA_DELAY_MS=2000
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=100
CONFIG_PMW3610_REST2_SAMPLE_TIME_MS=200
CONFIG_PMW3610_REST3_SAMPLE_TIME_MS=300
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=2000
CONFIG_PMW3610_REST1_DOWNSHIFT_TIME_MS=3000
CONFIG_PMW3610_REST2_DOWNSHIFT_TIME_MS=30000
