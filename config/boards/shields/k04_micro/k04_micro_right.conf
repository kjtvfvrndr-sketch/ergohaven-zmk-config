CONFIG_ZMK_POINTING=y
CONFIG_SPI=y
CONFIG_INPUT=y

CONFIG_USB_HID_POLL_INTERVAL_MS=1

CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
CONFIG_BT_BUF_ACL_TX_COUNT=10

CONFIG_PMW3610_ALT=y
# Регистр 0x32 в даташите PMW3610DM-SUDU называется DTEST2_PAD (дефолт 0x00),
# это управление тестовым выводом, а не режимом энергосбережения. Драйвер
# пишет туда 0x80 при shutter > 45, то есть значение определяется освещённостью
# последнего движения и переживает System OFF — чип запитан постоянно.
# Отключаем, чтобы регистр оставался в заводском состоянии.
CONFIG_PMW3610_ALT_SMART_ALGORITHM=n
CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=8
CONFIG_PMW3610_ALT_INIT_POWER_UP_EXTRA_DELAY_MS=0
CONFIG_PMW3610_ALT_RUN_DOWNSHIFT_TIME_MS=128
CONFIG_PMW3610_ALT_REST1_SAMPLE_TIME_MS=40
CONFIG_PMW3610_ALT_REST1_DOWNSHIFT_TIME_MS=9600