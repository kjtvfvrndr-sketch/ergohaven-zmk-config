CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000
CONFIG_ZMK_EXT_POWER=n

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# ─────────────────────────────────────────────────────────────────
# RGB-индикатор (форк zmk-rgbled-widget, ветка k04)
# ─────────────────────────────────────────────────────────────────

# Драйвер ленты. GPIO-бэкенд на nRF52840 недоступен (в Zephyr 3.5 он
# depends on SOC_SERIES_NRF51X), поэтому SPI на свободном spi1.
CONFIG_SPI=y
CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP=y
CONFIG_WS2812_STRIP_SPI=y

# НЕ включать CONFIG_ZMK_RGB_UNDERGLOW: два владельца одной ленты
# будут драться за неё. Виджет забирает диод через алиас led-strip.

CONFIG_RGBLED_WIDGET=y
# ZMK_BEHAVIOR_RGBLED_WIDGET и ZMK_BEHAVIOR_RGBLED_SYNC здесь НЕ ставим:
# это promptless-символы с default $(dt_compat_enabled,...), они включаются
# сами от devicetree. Первый — когда в раскладке появляется &ind_bat,
# второй — всегда, узел lyr_sync объявлен без /omit-if-no-ref/.
CONFIG_RGBLED_WIDGET_BRIGHTNESS=1
CONFIG_RGBLED_WIDGET_GREEN_TRIM=70

# ── заряд по кнопке &ind_bat, градиентом, каждая половина свой ──
CONFIG_RGBLED_WIDGET_BATTERY_SHOW_SELF=y
CONFIG_RGBLED_WIDGET_BATTERY_GRADIENT=y
CONFIG_RGBLED_WIDGET_BATTERY_BLINK_MS=1200
CONFIG_RGBLED_WIDGET_BATTERY_RGB_MISSING=0xFF00FF

# ── пульс низкого заряда: 3 вспышки раз в минуту ниже 10% ──
CONFIG_RGBLED_WIDGET_BATTERY_PULSE=y
CONFIG_RGBLED_WIDGET_BATTERY_PULSE_LEVEL=10
CONFIG_RGBLED_WIDGET_BATTERY_PULSE_PERIOD_S=60
CONFIG_RGBLED_WIDGET_BATTERY_PULSE_COUNT=3
CONFIG_RGBLED_WIDGET_BATTERY_PULSE_MS=100
CONFIG_RGBLED_WIDGET_BATTERY_PULSE_GAP_MS=150
CONFIG_RGBLED_WIDGET_BATTERY_PULSE_RGB=0xFF0000

# порог CRITICAL дублировал бы пульс — глушим
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=0

# ── жёлтый, пока нет связи ──
CONFIG_RGBLED_WIDGET_CONN_RGB_CONNECTED=0x00FF00
CONFIG_RGBLED_WIDGET_CONN_RGB_ADVERTISING=0xFFFF00
CONFIG_RGBLED_WIDGET_CONN_RGB_DISCONNECTED=0xFFFF00
CONFIG_RGBLED_WIDGET_CONN_BLINK_MS=300
CONFIG_RGBLED_WIDGET_CONN_REMIND=y
CONFIG_RGBLED_WIDGET_CONN_REMIND_PERIOD_S=5

# ── цвет слоя, зеркалится на левую половину ──
CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=y
CONFIG_RGBLED_WIDGET_LAYER_PUSH=y
# ВНИМАНИЕ: Kconfig .conf НЕ понимает комментарии в конце строки присваивания.
# Всё после '=' до конца строки — это значение. Комментарии только отдельными
# строками, иначе Kconfig ругнётся "invalid ... assignment ignored" и сборка
# упадёт на "Aborting due to Kconfig warnings".
#
#  0 en      погашен
#  1 ru      погашен
#  2 sym_en  синий
#  3 sym_ru  синий — намеренно как ru, см. ниже
#  4 nav     красный
#  5 adj     белый
#  6 game    маджента
#  7 mouse   зелёный
#  8 scroll  Желто-зеленый
#  9 gest_1  Бирюзовый
# 10 gest_2  Бледно-мятный
CONFIG_RGBLED_WIDGET_LAYER_0_RGB=0x000000
CONFIG_RGBLED_WIDGET_LAYER_1_RGB=0x000000
CONFIG_RGBLED_WIDGET_LAYER_2_RGB=0x0000FF
CONFIG_RGBLED_WIDGET_LAYER_3_RGB=0x0000FF
CONFIG_RGBLED_WIDGET_LAYER_4_RGB=0xFF0000
CONFIG_RGBLED_WIDGET_LAYER_5_RGB=0xFFFFFF
CONFIG_RGBLED_WIDGET_LAYER_6_RGB=0xFF00FF
CONFIG_RGBLED_WIDGET_LAYER_7_RGB=0x00FF00
CONFIG_RGBLED_WIDGET_LAYER_8_RGB=0x7FFF00
CONFIG_RGBLED_WIDGET_LAYER_9_RGB=0x00FFFF
CONFIG_RGBLED_WIDGET_LAYER_10_RGB=0x80FF80