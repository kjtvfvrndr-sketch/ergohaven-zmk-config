# Общий conf для обеих половин.
# Имя без суффикса стороны: ZMK отбрасывает _left/_right при поиске
# конфига, ровно как это работает у op36.conf.
#
# Содержимое приведено в соответствие с config/op36.conf — чтобы K:04
# вёл себя так же, как op36 до этого. Отличия помечены ниже.

CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000
CONFIG_ZMK_PM_SOFT_OFF=y
CONFIG_ZMK_EXT_POWER=n

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=600
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Нужно для комбо из op36_ruen (kha, hrdsgn, ru_io, cmbenru).
# Дефолты ZMK формально их вмещают, но значения взяты как у op36,
# чтобы поведение совпадало один-в-один.
CONFIG_ZMK_COMBO_MAX_KEYS_PER_COMBO=3
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=7