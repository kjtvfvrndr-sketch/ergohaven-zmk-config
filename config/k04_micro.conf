# Общий conf для обеих половин.
# Имя файла — базовое (k04_micro), без _left/_right: ZMK отбрасывает
# суффикс стороны при поиске конфига, ровно как это работает у op36.conf.

CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Энкодеры. Лежит в общем conf, а не в *_right.conf, потому что этот файл
# применяется к ОБЕИМ половинам — драйвер нужен там, где физически стоит
# модуль энкодера. Так же сделано в config/imperial44.conf.
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
